name: RAG Pipeline — Ingest, Index & Digest

on:
  schedule:
    - cron: "0 6 * * *" # every day at 06:00 UTC
  workflow_dispatch: # manual trigger from GitHub UI

jobs:
  pipeline:
    name: Run pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Run DB migrations on Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "RAILWAY_TOKEN is not configured. Skipping remote migration."
            exit 0
          fi

          PROJECT_ARG=""
          ENV_ARG=""
          SERVICE_ARG=""

          if [ -n "$RAILWAY_PROJECT_ID" ]; then
            PROJECT_ARG="--project $RAILWAY_PROJECT_ID"
          fi
          if [ -n "$RAILWAY_ENVIRONMENT" ]; then
            ENV_ARG="--environment $RAILWAY_ENVIRONMENT"
          fi
          if [ -n "$RAILWAY_SERVICE" ]; then
            SERVICE_ARG="--service $RAILWAY_SERVICE"
          fi

          railway ssh $PROJECT_ARG $ENV_ARG $SERVICE_ARG "npm run migrate"

      - name: Trigger pipeline on Railway
        env:
          APP_URL: ${{ vars.RAILWAY_APP_URL }}
        run: |
          URL="${APP_URL:-https://ai-news-digest-production.up.railway.app}"
          echo "Calling $URL/api/pipeline ..."

          RESPONSE=$(curl -fsS -X POST "$URL/api/pipeline" \
            -H "Content-Type: application/json" \
            --max-time 600)

          echo "$RESPONSE"

          # Fail the job if the response doesn't look like a successful pipeline result
          echo "$RESPONSE" | grep -q '"ingested"' || \
            (echo "Pipeline response missing expected fields" && exit 1)
