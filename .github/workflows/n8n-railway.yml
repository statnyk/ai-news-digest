# n8n branch: Test → Build Docker → Push to GHCR → Trigger Railway deploy.
# Add secret RAILWAY_DEPLOY_HOOK_URL in repo Settings → Secrets (from Railway service Deploy Hook).
name: n8n → Docker → Railway

on:
  push:
    branches: [n8n]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: npm ci && npm ci --prefix frontend

      - name: Run tests
        run: node --test --test-timeout=15000 tests/*.test.js
        timeout-minutes: 3

      - name: Build frontend
        run: npm run build --prefix frontend

  build-and-push:
    name: Build & Push Docker
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=n8n-latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-railway:
    name: Trigger Railway deploy
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Railway deploy
        run: |
          if [ -n "$HOOK_URL" ]; then
            curl -fsS -X POST "$HOOK_URL" && echo "Railway deploy triggered."
          else
            echo "RAILWAY_DEPLOY_HOOK_URL not set; add it in repo Secrets to trigger deploy."
          fi
        env:
          HOOK_URL: ${{ secrets.RAILWAY_DEPLOY_HOOK_URL }}
